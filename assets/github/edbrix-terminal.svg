<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="440" height="115" viewBox="0 0 440 115" role="img"><title>EdBrix Studios: Strategia, design e sviluppo</title><style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums}
@keyframes appear{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes reveal{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0)}}
@keyframes hide{to{opacity:0}}
@keyframes count{from{transform:translateY(0)}to{transform:translateY(-170px)}}
.counter{animation:count 1.2s steps(5,end) .7s both}
@keyframes blink{50%{opacity:0}}
.enter{animation:appear .35s cubic-bezier(.22,1,.36,1) both}
.bar{transform-box:fill-box;transform-origin:bottom;animation:grow .8s cubic-bezier(.22,1,.36,1) both}
.ascii{animation:reveal 3.4s steps(46,end) .25s both}
.color{animation:hide .8s 4.5s both}
.cursor{animation:blink 1s steps(1) 6}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.counter{transform:translateY(-170px)}.color{display:none!important}.ascii{clip-path:none!important}}
</style><rect width="440" height="115" fill="#0d1117"/><rect x="1" y="1" width="437" height="112" rx="4" fill="#0d1117" stroke="#30363d"/><circle cx="14" cy="15" r="2.5" fill="#ff5f57"/><circle cx="24" cy="15" r="2.5" fill="#febc2e"/><circle cx="34" cy="15" r="2.5" fill="#28c840"/><text x="219.5" y="19" font-size="10" fill="#919ba7" text-anchor="middle">project / edbrix</text><path d="M1 30h437" stroke="#30363d"/><text x="16" y="55" font-size="17" fill="#e6edf3" font-weight="600">EdBrix Studios</text><text x="16" y="78" font-size="11" fill="#919ba7" >Strategia, design e sviluppo</text><text x="16" y="99" font-size="10" fill="#3fb950" >edbrixstudios.vercel.app</text></svg>